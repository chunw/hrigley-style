    <meta name="theme-color" content="#f47bbc">
    <script>
      // Apply the saved theme (default: dark) before first paint, so the
      // page never flashes the light background for dark-default visitors.
      try {
        if (localStorage.getItem("cw-theme") !== "light") {
          document.documentElement.classList.add("theme-dark");
        }
      } catch (e) {
        document.documentElement.classList.add("theme-dark");
      }
    </script>

    <!-- 朱雀仿宋 (Zhuque Fangsong) webfont. Loaded via <link referrerpolicy="no-referrer"> rather than
         a CSS @import: the CDN (fontsapi.zeoseven.com) 204s requests carrying a localhost/private-IP
         Referer, which silently killed this font (and its English-text fallback everywhere it's
         used) on local dev while working fine on the production domain. -->
    <link href="https://fontsapi.zeoseven.com/7/main/result.css" rel="stylesheet" referrerpolicy="no-referrer">
